$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:uuid:c79d91fc-c1f9-479e-a079-9ba5d301a21c"
title: "Document front matter"
description: >
  The front matter of each document type under {language}/docs/. A
  document is checked against the definition for its type, chosen by the
  directory it lives in: directives, guides, decisions, references or
  sessions.
$defs:
  common:
    type: object
    required: [title, "dc:title", "dc:creator", "dc:description", "dc:date",
               "dc:type", "dc:format", "dc:identifier", "dc:language",
               "dc:rights", "sat:version", "sat:status"]
    properties:
      title:
        type: string
        minLength: 1
      "dc:title":
        type: string
        minLength: 1
      "dc:creator":
        type: string
        minLength: 1
      "dc:contributor":
        type: string
      "dc:subject":
        type: string
      "dc:description":
        type: string
        minLength: 1
      "dc:date":
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      "dc:type":
        const: "Text"
      "dc:format":
        const: "text/markdown"
      "dc:identifier":
        type: string
        pattern: '^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      "dc:source":
        type: string
      "dc:relation":
        type: [string, array]
        items:
          type: string
      "dc:language":
        type: string
        pattern: '^[a-z]{2}-[A-Z]{2}$'
      "dc:rights":
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9.+-]*$'
      "sat:version":
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  directive:
    title: "directive"
    allOf:
      - $ref: "#/$defs/common"
      - required: ["sat:directive", "sat:enforced_by"]
        properties:
          "sat:status":
            enum: ["In force", "Alternative", "Superseded"]
          "sat:directive":
            description: "The directive's identifier, {domain}/{slug}"
            type: string
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$'
          "sat:enforced_by":
            description: "The checks that enforce it; empty when the rule has no check"
            type: array
            items:
              type: string
          "sat:alternative_to":
            type: string
  guide:
    title: "guide"
    allOf:
      - $ref: "#/$defs/common"
      - properties:
          "sat:status":
            enum: ["Accepted", "Superseded"]
  decision:
    title: "decision"
    allOf:
      - $ref: "#/$defs/common"
      - properties:
          "sat:status":
            enum: ["Accepted", "Superseded"]
          "sat:decision":
            description: "The brief's identifier for the decision, such as D13, where it had one"
            type: string
  reference:
    title: "reference"
    allOf:
      - $ref: "#/$defs/common"
      - properties:
          "sat:status":
            enum: ["Accepted", "Superseded"]
  session:
    title: "session"
    allOf:
      - $ref: "#/$defs/common"
      - properties:
          "sat:status":
            enum: ["Accepted"]
